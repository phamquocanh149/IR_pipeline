[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ir-system"
version = "0.1.0"
description = "End-to-end Information Retrieval pipeline"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "bm25s>=0.2.0,<0.3",
    "numpy>=1.24",
    "tqdm>=4.66",
]


[project.optional-dependencies]
dense = [
    "faiss-cpu==1.15.1",
    "sentence-transformers==5.7.0",
    "transformers==4.57.6",
    "torch==2.14.1",
]
cross-encoder = [
    "sentence-transformers==5.7.0",
    "transformers==4.57.6",
    "torch==2.14.1",
]
all = [
    "sentence-transformers==5.7.0",
    "transformers==4.57.6",
    "torch==2.14.1",
    "faiss-cpu==1.15.1",
]

[project.scripts]
ir-system = "ir_system.cli.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["ir_system*"]
